hydra:
  output_subdir: null
  run:
    dir: . #unix or macos
    #dir: /dev/null # windows
seed: 0
acceleration: 'cpu' #'cpu' for all cores minus one, 'cpu:3' for 3 cores. Adila creates processes per *.pred file and per row (test team) for the prediction matrix in the file.

data:
  fteamsvecs: ../output/dblp/toy.dblp.v12.json/teamsvecs.pkl
  fgender:    ../output/dblp/toy.dblp.v12.json/females.csv
  fsplits:    ../output/dblp/toy.dblp.v12.json/splits.f3.r0.85.pkl
  fpred:      ../output/dblp/toy.dblp.v12.json/splits.f3.r0.85/rnd.b1000 # a subfolder containing f*.test*.pred like f*.test.e*.pred or f*.test.pred
  #fpred:      ../output/dblp/toy.dblp.v12.json/splits.f3.r0.85/rnd.b1000/f0.test.pred # or a single file like f0.test.pred
  output:     ../output/dblp/toy.dblp.v12.json/splits.f3.r0.85/rnd.b1000

fair: #post-hoc reranks of the prediction list
  algorithm: [fa-ir, det_greedy, det_relaxed, det_const_sort] #reranking algorithms (det_const is buggy for some k_max values :\)
  notion: [eo,dp] # equality of odds (eo), demographic parity (dp)
  attribute: [gender, popularity] #the sensitive attribute(s)
  k_max: 10 #cutoff for the reranking algorithms; this is the max depth, e.g., 100 or 1000, the algorithm goes down the list to bring up an expert
  manual_ratio: #hard ratio for desired minority experts after reranking (e.g., female (disadvantaged group) or popular (advantaged group)); if None, based on distribution in dataset (dp) or skilled/qualified experts (eo); default: None; Eg. 0.5
  is_popular_alg: [avg, auc] #popularity status based on `avg` teams per experts, i.e., whoever above this value is popular, or whoever is in the head of `auc` distribution figure
  is_popular_coef: 1.5
  alpha: 0.1 #the significance value for fa-ir algorithm

eval:
  per_instance: True # needed for paired significance tests
  metrics:
    topk: '1,2,${fair.k_max}'
    fair: [ndkl_topk, skew_topk] #, exp, expu >> python 3.9+ from FairRankTune
    trec: [P_topk, recall_topk, ndcg_cut_topk, map_cut_topk, success_topk] # see trec_eval for a complete list or trec_* metrics https://github.com/terrierteam/pytrec_eval/blob/master/tests/pytrec_eval_tests.py
    other: []
